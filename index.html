<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Phone</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>📱 Find My Phone</h1>
      <span id="connectionStatus" class="connection-status" title="Checking connection…">
        <span class="dot"></span> <span class="label">Connecting…</span>
      </span>
    </div>
    <form id="addDeviceForm">
      <input type="text" id="newDeviceId" placeholder="Device ID / PIN" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <div id="deviceList"></div>
    <p class="hint">To make a phone findable, open <code>track.html</code> on it and start sharing with the same Device ID.</p>

    <div class="legend">
      <div class="legend-title">Legend</div>
      <div class="legend-row"><span class="legend-swatch pin"></span> Tracked phone</div>
      <div class="legend-row"><span class="legend-swatch stale"></span> Not currently sharing</div>
      <div class="legend-row"><span class="legend-swatch mine"></span> Your location</div>
      <div class="legend-row"><span class="legend-swatch route"></span> Directions route</div>
      <div class="legend-row"><span class="legend-swatch trail"></span> Recent path (last hour)</div>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
